<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteBox</title>
<meta name="theme-color" content="#0F4D3A">
<meta name="description" content="Fair, private elections for schools, departments and churches.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><p style="font:16px system-ui,sans-serif;text-align:center;margin-top:40px">Loading VoteBox&hellip;</p></div>
<noscript><p style="font:16px system-ui,sans-serif;text-align:center">VoteBox needs JavaScript. Please turn it on in your browser.</p></noscript>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/owner.js"></script>
<script src="js/admin.js"></script>
<script src="js/voter.js"></script>
<script src="js/main.js"></script>
<script>
  // If the other files were not uploaded next to this page, say so instead of showing a blank screen.
  if (!window.VB || !window.VB.route) {
    document.getElementById('app').innerHTML =
      '<div style="font:16px/1.5 system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px">' +
      '<h2>VoteBox could not start</h2>' +
      '<p>The app files are missing. Make sure the <b>js</b>, <b>css</b> and <b>assets</b> folders and <b>config.js</b> are uploaded in the same place as this page.</p></div>';
  }
</script>
</body>
</html>
